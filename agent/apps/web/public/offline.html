<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>PolyKit Agent 暂时离线</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #171718;
        color: #f4f1f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
        background: #171718;
      }

      main {
        width: min(100%, 460px);
        text-align: center;
      }

      .brand-icon {
        display: block;
        width: 104px;
        height: 104px;
        margin: 0 auto 28px;
        border: 1px solid #343038;
        border-radius: 24px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 23px;
        font-weight: 680;
        line-height: 1.35;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #aaa4b0;
        font-size: 14px;
        line-height: 1.75;
      }

      button {
        margin-top: 28px;
        min-width: 136px;
        min-height: 42px;
        padding: 0 18px;
        border: 1px solid #48424d;
        border-radius: 6px;
        background: #29262b;
        color: #f4f1f7;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
      }

      button:hover {
        border-color: #655d6b;
        background: #332f35;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 2px solid #f29368;
        outline-offset: 3px;
      }

      .retry-icon {
        display: inline-block;
        margin-right: 7px;
        font-size: 16px;
        line-height: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <img class="brand-icon" src="/icons/icon-192.png" alt="" />
      <h1>PolyKit Agent 暂时离线</h1>
      <p>无法连接本地 PolyKit Agent 服务。请确认服务已启动，并检查网络连接。</p>
      <button type="button" onclick="location.reload()"><span class="retry-icon" aria-hidden="true">↻</span>重新连接</button>
    </main>
  </body>
</html>
