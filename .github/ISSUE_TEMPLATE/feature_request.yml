name: ✨ Feature request
description: Suggest a PolyKit improvement
labels: [enhancement, "pending triage"]
body:
  - type: markdown
    attributes:
      value: Search existing issues before proposing a new feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should PolyKit solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues.
          required: true
